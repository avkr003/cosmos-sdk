syntax = "proto3";
package cosmos.amm.v1beta1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/amm/v1beta1/amm.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/amm/types";

service Query {

  rpc Pool(QueryPoolRequest) returns (QueryPoolResponse) {
    option (google.api.http).get = "/cosmos/amm/v1beta1/pool/{poolId}";
  }

  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse) {
    option (google.api.http).get = "/cosmos/amm/v1beta1/pools";
  }

  rpc PoolShares(QueryPoolSharesRequest) returns (QueryPoolSharesResponse) {
    option (google.api.http).get = "/cosmos/amm/v1beta1/poolShare/{address}";
  }

  rpc Parameters(QueryParametersRequest) returns (QueryParametersResponse) {
    option (google.api.http).get = "/cosmos/amm/v1beta1/parameters";
  }
}

message QueryPoolRequest {
  uint64 poolId = 1;
}

message QueryPoolResponse {
  Pool pool = 1 [(gogoproto.nullable) = false];
}

message QueryPoolsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryPoolsResponse {
  repeated Pool pools = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];

  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolSharesRequest {
  string address = 1;
}

message QueryPoolSharesResponse {

  repeated cosmos.base.v1beta1.Coin shares = 1 [(gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins", (gogoproto.nullable) = false, (amino.dont_omitempty) = true];

}


message QueryParametersRequest {}

message QueryParametersResponse {

  Params params = 1 [(gogoproto.nullable) = false];
}
