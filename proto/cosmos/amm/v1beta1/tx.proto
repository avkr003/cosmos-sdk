syntax = "proto3";
package cosmos.amm.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/amm/v1beta1/amm.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "amino/amino.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/amm/types";

service Msg {
  rpc CreatePool(MsgCreatePoolMessage) returns (MsgCreatePoolResponse);

  rpc JoinPool(MsgJoinPoolMessage) returns (MsgJoinPoolResponse);

  rpc Swap(MsgSwapMessage) returns (MsgSwapResponse);

  rpc ExitPool(MsgExitPoolMessage) returns (MsgExitPoolResponse);

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

}

message MsgCreatePoolMessage {
  option (cosmos.msg.v1.signer) = "from";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string from = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin tokens = 2 [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
  string fee = 3 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec", (gogoproto.nullable) = false];
}

message MsgCreatePoolResponse {}

message MsgJoinPoolMessage {
  option (cosmos.msg.v1.signer) = "from";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string from = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 poolId = 2;
  repeated cosmos.base.v1beta1.Coin tokens = 3 [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
}

message MsgJoinPoolResponse {}

message MsgSwapMessage {
  option (cosmos.msg.v1.signer) = "from";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string from = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 poolId = 2;
  cosmos.base.v1beta1.Coin token = 3 [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
}

message MsgSwapResponse {}

message MsgExitPoolMessage {
  option (cosmos.msg.v1.signer) = "from";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string from = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 poolId = 2;
  string lpShare = 3 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int", (gogoproto.nullable) = false];
  bool withdrawAll = 4;
}

message MsgExitPoolResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cosmos-sdk/x/amm/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
};

message MsgUpdateParamsResponse {};
