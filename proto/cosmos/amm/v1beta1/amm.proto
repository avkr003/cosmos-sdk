syntax = "proto3";
package cosmos.amm.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/amm/types";

message Pool {
  option (gogoproto.equal) = true;

  uint64 id = 1;

  string name = 2;

  cosmos.base.v1beta1.Coin token1 = 3[(gogoproto.nullable) = false];

  cosmos.base.v1beta1.Coin token2 = 4[(gogoproto.nullable) = false];

  string fee = 5 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec", (gogoproto.nullable) = false];

  string creator = 6;
}

message Params {
  option (amino.name) = "cosmos-sdk/x/amm/Params";
  option (gogoproto.goproto_stringer) = false;
  option (gogoproto.equal) = true;

  repeated string swap_allowed_tokens = 1;
  string max_swap_fee = 2 [(gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec", (gogoproto.nullable) = false];
}
